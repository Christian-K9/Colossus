[Logging_Service_Shut_Down]
action.lookup = 1
action.lookup.append = 1
action.lookup.filename = windows_events.csv
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 0
counttype = number of events
cron_schedule = */10 * * * *
description = Windows Code 4624 detected account successfully logging in
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.events.fields = ["host","sourcetype"]
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=* sourcetype="WinEventLog:Security" "EventCode=1100" | eval severity="Error" | eval code="Event logging service shut down" | table _time severity code EventCode AccountName Process_ID Source_Network_Address Source_Port

