request.ui_dispatch_view = search
search = index=* source="/opt/test.log" | rex field=_raw "^[^|]+\|(?<Severity>[^|]+)" |  rex field=_raw "^[^<]+\|(?<Message>[^>]+)" | table _time Severity Message

[Process_Check]
action.lookup = 1
action.lookup.append = 1
action.lookup.filename = linux_alerts.csv
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 0
counttype = number of events
