request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=* source="/opt/Greyrose.log" | rex field=_raw "^[^#PE]+\|(?<ProcessID>[^<]+)" |  rex field=_raw "^[^<]+\|(?<Message>[^>]+)" | table _time ProcessID Message

